name: ci
on:
  pull_request: {}
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0
      # Fresh local Postgres; applies every file in supabase/migrations/ and fails on the first error.
      - run: supabase db start
      - run: scripts/check-migrations.sh
      # RLS tests in supabase/tests/: who can read and write what, as anon, member, leader and hq.
      - run: supabase test db
      # 0003 on a database that already has teams, people and check-ins, as production gets it.
      # Leaves the database at 0002, so it runs last.
      - run: supabase db reset --version 0002 --no-seed
      - run: scripts/check-team-tree-upgrade.sh
